<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tredzi — Trade Math Calculator</title>

    <!--
      No Google Fonts / webfont <link> tags on purpose.
      Tredzi now renders every number using each platform's own native
      system font (SF Pro on iOS/Mac, Roboto on Android, Segoe UI on
      Windows) — the same approach Telegram, WhatsApp and Facebook use.
      This means: no network request for fonts, nothing that can be
      blocked by an ad-blocker/privacy shield, and no risk of a
      dotted/slashed "0" ever showing up, on any device, ever again.
    -->

    <style>
      html, body { margin: 0; padding: 0; background: #0b0f16; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      This directly mounts TredziApp.jsx — no separate main.jsx needed.
      Adjust the import path below only if TredziApp.jsx lives in a
      different folder relative to this index.html.
    -->
    <script type="module">
      import { createRoot } from "react-dom/client";
      import TredziApp from "./TredziApp.jsx";
      createRoot(document.getElementById("root")).render(<TredziApp />);
    </script>
    <!--
      Note: the JSX syntax above (<TredziApp />) needs a build tool that
      compiles JSX (Vite, CRA, Next, etc) — browsers can't parse it as-is.
      If you're not using a bundler, replace the block above with:
        import { createRoot } from "react-dom/client";
        import { createElement } from "react";
        import TredziApp from "./TredziApp.jsx";
        createRoot(document.getElementById("root")).render(createElement(TredziApp));
    -->
  </body>
</html>
