<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tredzi — Trade Math Calculator</title>

    <style>
      html, body { margin: 0; padding: 0; background: #0b0f16; }
      #root { min-height: 100dvh; }
    </style>

    <!--
      Tailwind CSS (Play CDN build) — zero-build, no install. The whole
      app's layout (cards, spacing, rounded corners, flex layouts) is
      built with Tailwind utility classes, so this has to be loaded
      for anything to look right.
    -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!--
      GitHub Pages friendly setup: no npm install, no build step.
      This import map tells the browser where to fetch "react",
      "react-dom/client", "lucide-react" and "recharts" from (a CDN),
      so TredziApp.jsx's normal `import ... from "react"` lines work
      as-is with zero changes.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
          "recharts": "https://esm.sh/recharts@2.12.7?deps=react@18.3.1,react-dom@18.3.1"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Babel Standalone transpiles TredziApp.jsx's JSX right in the
      browser (no build tool needed). data-type="module" makes it run
      as a real ES module, so the import map above applies to it.
      TredziApp.jsx already mounts itself into #root at the bottom of
      the file — nothing else is needed here.
    -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" data-type="module" data-presets="react" src="./TredziApp.jsx"></script>
  </body>
</html>
