<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tredzi — Trade Math Calculator</title>

    <!--
      No Google Fonts / webfont <link> tags on purpose.
      Tredzi now renders every number using each platform's own native
      system font (SF Pro on iOS/Mac, Roboto on Android, Segoe UI on
      Windows) — the same approach Telegram, WhatsApp and Facebook use.
      This means: no network request for fonts, nothing that can be
      blocked by an ad-blocker/privacy shield, and no risk of a
      dotted/slashed "0" ever showing up, on any device, ever again.
    -->

    <style>
      html, body { margin: 0; padding: 0; background: #0b0f16; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Adjust this section to match your actual build tool (Vite, CRA,
      Capacitor, etc). If you're using Vite, this is typically just:
        <script type="module" src="/src/main.jsx"></script>
      and main.jsx does:
        import { createRoot } from "react-dom/client";
        import TredziApp from "./Tredzi.jsx";
        createRoot(document.getElementById("root")).render(<TredziApp />);
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
